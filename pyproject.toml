[project]
name = "stem-radar"
version = "0.1.0"
description = "AI-Powered STEM & Technology Intelligence Platform Telegram Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.0,<23.0",
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.10",
    "SQLAlchemy[asyncio]>=2.0.25",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "APScheduler>=3.10.4",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
